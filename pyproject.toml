[project]
name = "local-literature-agent"
version = "1.0.0"
description = "Local-first Chinese academic literature agent: retrieval, structured reading, review generation, citation verification and paper chat (LangGraph + Ollama)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0,<2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.24.0,<2.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.1", "mypy>=1.11.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lit_agent*"]

[tool.setuptools.package-data]
"lit_agent" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
